name: Encrypted database backup
on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Read consistent snapshot and encrypt before upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_BACKUP_URL }}
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
        run: node tools/backup.mjs create game.pskor-backup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-database-${{ github.run_id }}
          path: game.pskor-backup
          if-no-files-found: error
          retention-days: 90
