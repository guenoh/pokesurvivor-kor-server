name: Manual Render deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokesurvivor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d pokesurvivor_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test-only-password@localhost:5432/pokesurvivor_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test --test-timeout=30000 test/*.test.js
      - run: node tools/build-client.mjs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy the tested server commit after manual approval
        env:
          ENABLED: ${{ vars.RENDER_DEPLOY_ENABLED }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true
          [[ "$DEPLOY_HOOK" == https://api.render.com/deploy/srv-*\?key=* ]]
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9-]+\.onrender\.com$ ]]
          response=$(curl --fail --silent --show-error --request POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}")
          printf '%s\n' "$response" | jq -e '.deploy.id'
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 10 "$SERVICE_URL/release.json" | jq -e --arg sha "$GITHUB_SHA" '.server == $sha' >/dev/null; then
              curl --fail --silent --show-error --max-time 30 "$SERVICE_URL/api/health" | jq -e '.ok == true'
              echo 'The tested release is live and the database health check passed.'
              exit 0
            fi
            sleep 15
          done
          echo 'Deployment did not become healthy in time. Check Render logs and keep the previous release available.' >&2
          exit 1
