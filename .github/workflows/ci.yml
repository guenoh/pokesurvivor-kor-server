name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokesurvivor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d pokesurvivor_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test-only-password@localhost:5432/pokesurvivor_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --check src/app.js && node --check src/server.js
      - run: node --test --test-timeout=30000 test/*.test.js
      - name: Build and test the pinned Korean game
        run: node tools/build-client.mjs
      - name: Validate container and production startup
        run: |
          POSTGRES_PASSWORD=test-only-password APP_ORIGIN=https://game.example.invalid docker compose config --quiet
          docker build --tag pokesurvivor-kor-server:ci .
          docker run -d --name api-ci --network host -e DATABASE_URL -e APP_ORIGIN=https://game.example.invalid pokesurvivor-kor-server:ci
          trap 'docker rm -f api-ci' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs api-ci
          exit 1
