# Always-on web compute requires billing approval. DATABASE_URL stays on Neon Free.
services:
  - type: web
    name: pokesurvivor-kor
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --ignore-scripts --prod=false && node tools/build-client.mjs
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: STATIC_ROOT
        value: ./public
      - key: MIGRATE_ON_START
        value: "true"
      - key: DATABASE_URL
        sync: false
