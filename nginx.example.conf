# Place these locations inside your HTTPS server block.
# Serve frontend releases through /srv/pokesurvivor-kor/current.
root /srv/pokesurvivor-kor/current;
index index.html;
client_max_body_size 1m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location = /version.json { add_header Cache-Control "no-store" always; }
location = /sw.js { add_header Cache-Control "no-cache" always; }
location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
